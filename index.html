<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITIL v5 Foundation Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  /* soft, low-glare light palette: no pure white, no pure black */
  --bg:#eceee8; --paper:#f6f6f1; --ink:#2f3540; --ink-2:#4a505c; --muted:#7d828b; --line:#dcdfd6; --line-2:#c9cdc2;
  --navy:#41607a; --navy-2:#4f6f8a; --gold:#9c8461; --gold-soft:#ebe5d8;
  --good:#4a7a5f; --good-bg:#e5eee6; --good-line:#bdd1c1;
  --bad:#a35d55; --bad-bg:#f1e4e1; --bad-line:#dcc0bb;
  --warn:#8f7440; --warn-bg:#f1ead9; --warn-line:#dccca4;
  --on-accent:#eef1ec; --chip:#e3e6de; --gold-2:#b7a07c; --key:#eef0ea; --hover:#f1f3ed; --fb:#f0f1eb;
  --sh1:rgba(47,53,64,.05); --sh2:rgba(47,53,64,.12); --sh3:rgba(47,53,64,.22);
  --serif:"Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:"Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --shadow:0 1px 2px var(--sh1), 0 8px 24px -12px var(--sh2);
  --shadow-lift:0 2px 4px var(--sh1), 0 16px 32px -14px var(--sh3);
}
/* soft dark palette: deep slate, not black; muted text, not white */
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1d2127; --paper:#252a31; --ink:#d8dbd5; --ink-2:#b4b8b2; --muted:#8b9199; --line:#333942; --line-2:#414853;
  --navy:#8eadc6; --navy-2:#a4c0d6; --gold:#c4aa7c; --gold-soft:#3a3428;
  --good:#8fbe9e; --good-bg:#24322a; --good-line:#3d5a47;
  --bad:#d89c94; --bad-bg:#3a2a28; --bad-line:#5f423e;
  --warn:#d3b67c; --warn-bg:#352f21; --warn-line:#5d4f31;
  --on-accent:#1d2127; --chip:#2e343c; --gold-2:#d9c49a; --key:#2b3038; --hover:#2a3038; --fb:#22272e;
  --sh1:rgba(0,0,0,.18); --sh2:rgba(0,0,0,.28); --sh3:rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{transition:background .25s,color .25s}
.theme-tog{position:fixed;top:16px;right:16px;z-index:10;width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);box-shadow:var(--shadow)}
.theme-tog svg{width:18px;height:18px}
.theme-tog .moon{display:block}.theme-tog .sun{display:none}
:root[data-theme="dark"] .theme-tog .moon{display:none}
:root[data-theme="dark"] .theme-tog .sun{display:block}
@media (max-width:640px){.theme-tog{top:10px;right:10px;width:36px;height:36px}}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:40px 16px 80px}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.005em;color:var(--ink)}
h1{font-size:clamp(2.1rem,5vw,3rem);line-height:1.05;margin:6px 0 10px}
h2{font-size:1.9rem;line-height:1.15;margin:0 0 6px}
.eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.rule{width:56px;height:2px;background:var(--gold);margin:18px 0 0;border:0}
.sub{color:var(--muted);margin:0 0 26px}
button{font:inherit;font-size:.92rem;cursor:pointer;border-radius:8px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);padding:9px 18px;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .15s}
button:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--navy);color:var(--on-accent);border-color:var(--navy);font-weight:500;letter-spacing:.01em}
button.primary:hover:not(:disabled){background:var(--navy-2);border-color:var(--navy-2);color:var(--on-accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding-left:4px}
button.ghost:hover:not(:disabled){color:var(--navy);border-color:transparent}
button:disabled{opacity:.5;cursor:default}

/* masthead */
.mast{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:26px}
.mast p{color:var(--ink-2);max-width:520px;margin:0}
.figs{display:flex;gap:28px}
.fig{text-align:right}
.fig b{display:block;font-family:var(--serif);font-size:2.3rem;font-weight:600;line-height:1;color:var(--navy)}
.fig span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.toolbar{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
.toolbar .spacer{flex:1}

/* section cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow)}
.sec{display:flex;flex-direction:column;position:relative;transition:box-shadow .2s,transform .2s,border-color .2s}
.sec:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);border-color:var(--line-2)}
.sec .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sec .num{font-family:var(--serif);font-size:2.6rem;line-height:.9;color:var(--gold);font-weight:500}
.sec .tag{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.sec h3{margin:14px 0 6px;font-size:1.38rem;line-height:1.2}
.sec .refs{font-size:.8rem;color:var(--muted);margin-bottom:16px;flex:1}
.sec .stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;padding-top:14px;border-top:1px solid var(--line)}
.sec .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.sec .row button{width:100%;height:42px;padding:0 10px;white-space:nowrap;display:flex;align-items:center;justify-content:center;font-size:.9rem;line-height:1}
.sec .num,.fig b,.big,.timer span,.rev .q i{font-variant-numeric:lining-nums tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.74rem;background:var(--chip);color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.pill.pass{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.pill.fail{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.pill.quiet{background:transparent;border-color:var(--line-2);color:var(--muted)}

/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:26px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .4s ease}
.timer{position:relative;width:46px;height:46px;flex:none}
.timer svg{transform:rotate(-90deg);display:block}
.timer .trk{stroke:var(--line)}
.timer .val{stroke:var(--navy);transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.low .val{stroke:var(--bad)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low span{color:var(--bad)}
.qcard{padding:34px 36px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.qtext{font-family:var(--serif);font-size:1.6rem;line-height:1.3;font-weight:600;white-space:pre-line;margin:0 0 26px;color:var(--ink)}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:16px;align-items:center;text-align:left;padding:15px 18px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:.98rem;line-height:1.5;color:var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-family:var(--serif);font-weight:600;font-size:1.05rem;color:var(--ink-2);background:var(--key);transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--navy);background:var(--hover);color:var(--ink);box-shadow:var(--shadow)}
.opt:hover:not(:disabled) .k{border-color:var(--navy);color:var(--navy)}
.opt.correct{border-color:var(--good-line);background:var(--good-bg)}
.opt.correct .k{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.opt:disabled{opacity:1;cursor:default}
.opt.dim{opacity:.55}
.fb{margin-top:22px;border-radius:10px;padding:18px 20px;border:1px solid var(--line);border-left-width:3px;background:var(--fb)}
.fb.good{border-left-color:var(--good)}
.fb.bad{border-left-color:var(--bad)}
.fb.time{border-left-color:var(--warn)}
.fb .t{display:block;font-family:var(--serif);font-size:1.35rem;font-weight:600;margin-bottom:6px}
.fb.good .t{color:var(--good)} .fb.bad .t{color:var(--bad)} .fb.time .t{color:var(--warn)}
.fb .why{color:var(--ink-2)}
.fb .why b{font-weight:600;color:var(--ink)}
.src{font-size:.74rem;letter-spacing:.04em;color:var(--muted);margin-top:10px;text-transform:uppercase}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.kbd{font-size:.76rem;color:var(--muted)}

/* results & study */
.score{text-align:center;padding:40px 24px}
.big{font-family:var(--serif);font-size:4.4rem;font-weight:600;line-height:1;margin:10px 0 8px;color:var(--navy)}
.big small{font-size:2rem;color:var(--muted);font-weight:500}
.verdict{display:flex;justify-content:center;gap:10px;align-items:center;color:var(--ink-2);margin-bottom:22px}
.revcard{margin-top:22px;padding:8px 32px}
.rev{border-top:1px solid var(--line);padding:22px 0}
.rev:first-child{border-top:0}
.rev .q{font-family:var(--serif);font-size:1.2rem;font-weight:600;line-height:1.35;white-space:pre-line}
.rev .q i{font-style:normal;color:var(--gold);margin-right:6px}
.rev .a{margin-top:8px;font-size:.92rem}
.rev .ok{color:var(--good)} .rev .no{color:var(--bad)}
.rev .e{margin-top:8px;font-size:.9rem;color:var(--ink-2);padding-left:14px;border-left:2px solid var(--line-2)}
.rev .e i{color:var(--muted);font-style:normal;font-size:.8rem}
.hint{font-size:.8rem;color:var(--muted);margin-top:30px;text-align:center}
.notice{font-size:.86rem;color:var(--ink-2);background:var(--warn-bg);border:1px solid var(--warn-line);border-left:3px solid var(--gold);border-radius:8px;padding:10px 14px;margin:-8px 0 24px}
.notice b{color:var(--ink);font-weight:600}
label.tog{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink-2);cursor:pointer}
label.tog input{accent-color:var(--navy);width:16px;height:16px}
.hidden{display:none}
@media (max-width:640px){
  .wrap{padding:26px 16px 60px}
  .mast{grid-template-columns:1fr;gap:18px}
  .figs{gap:22px}.fig{text-align:left}
  .qcard{padding:22px 18px}
  .qtext{font-size:1.3rem}
  .big{font-size:3.4rem}
  .revcard{padding:4px 18px}
  .toolbar .spacer{display:none}
}
</style>
</head>
<body>
<script>
// Apply the saved theme before the page draws, so there is no flash. Light is the default.
(function(){ var t = 'light'; try { t = localStorage.getItem('itil5quiz.theme') || 'light'; } catch(e){} document.documentElement.setAttribute('data-theme', t); })();
</script>
<button class="theme-tog" id="themeTog" title="Switch light / dark mode" aria-label="Switch light or dark mode">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
</button>
<script>
document.getElementById('themeTog').onclick = function(){
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('itil5quiz.theme', next); } catch(e){}
};
</script>
<div class="wrap" id="app"></div>

<script>
// Question bank registry. Each questions/sNN.js file calls QB.add(...).
// Item format: [question, correctAnswer, [wrong1, wrong2, wrong3], explanation, source]
window.QB = { sections: [], add(n, title, refs, items){ this.sections[n-1] = {n, title, refs, items}; } };
</script>

<script src="questions/s02.js"></script>
<script src="questions/s03.js"></script>
<script src="questions/s04.js"></script>

<script src="questions/s07.js"></script>
<script src="questions/s08.js"></script>
<script src="questions/s09.js"></script>
<script src="questions/s10.js"></script>
<script src="questions/s11.js"></script>
<script src="questions/s12.js"></script>
<script src="questions/s13.js"></script>

<script src="questions/s17.js"></script>
<script>
(function(){
const TIME = 60, PASS = 0.65, KEY = 'itil5quiz.v1';
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isList = o => /^\d and \d$/.test(o);

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} }
let store = load();
let prefs = Object.assign({shuffleQ: true, timer: true}, store.prefs || {});

let state = null, tick = null;

function home(){
  stopTimer();
  const secs = QB.sections.filter(Boolean);
  const total = secs.reduce((s, x) => s + x.items.length, 0);
  const done = secs.filter(s => ((store.sec || {})[s.n] || {}).best != null);
  const passed = done.filter(s => store.sec[s.n].best >= PASS * s.items.length).length;
  let html = `<header class="mast"><div>
    <div class="eyebrow">ITIL® Foundation · Version 5</div>
    <h1>Exam Practice Studio</h1>
    <p>Timed practice in the format of the real exam: 40 questions per section, one minute each, with an explanation after every answer. Pass mark 65% (26 of 40).</p>
    <hr class="rule"></div>
    <div class="figs">
      <div class="fig"><b>${secs.length}</b><span>Sections</span></div>
      <div class="fig"><b>${total}</b><span>Questions</span></div>
      <div class="fig"><b>${passed}<small style="font-size:1.2rem;color:var(--muted)">/${secs.length}</small></b><span>Passed</span></div>
    </div></header>
  <div class="notice" role="note"><b>For practice only.</b> Every question here is an original sample question written for revision. None are taken from, or represent, the official ITIL® Foundation (Version 5) exam.</div>
  <div class="toolbar">
    <label class="tog"><input type="checkbox" id="pShuf" ${prefs.shuffleQ ? 'checked' : ''}> Shuffle question order</label>
    <label class="tog"><input type="checkbox" id="pTime" ${prefs.timer ? 'checked' : ''}> One-minute timer</label>
    <span class="spacer"></span>
    <button id="mock" class="primary">Take a mock exam &nbsp;→</button>
  </div><div class="grid">`;
  secs.forEach(s => {
    const st = (store.sec || {})[s.n] || {};
    const best = st.best != null ? `<span class="pill ${st.best >= PASS * s.items.length ? 'pass' : 'fail'}">Best ${st.best}/${s.items.length}</span>` : '<span class="pill quiet">Not yet attempted</span>';
    const last = st.last != null ? `<span class="pill">Last ${st.last}/${s.items.length}</span>` : '';
    const att = st.attempts ? `<span class="pill">${st.attempts} attempt${st.attempts > 1 ? 's' : ''}</span>` : '';
    html += `<div class="card sec"><div class="head"><div class="num">${String(s.n).padStart(2, '0')}</div><div class="tag">${s.items.length} questions</div></div>
      <h3>${esc(s.title)}</h3>
      <div class="refs">${esc(s.refs)}</div><div class="stats">${best}${last}${att}</div>
      <div class="row"><button class="primary" data-start="${s.n}">Begin</button><button data-study="${s.n}">Study answers</button></div></div>`;
  });
  html += `</div><p class="hint">Press 1–4 or A–D to answer and Enter to continue. Scores are saved in this browser only. ·
  <button id="reset" class="ghost" style="font-size:.8rem;padding:2px 4px;text-decoration:underline">Reset scores</button></p>
  <p class="hint" style="margin-top:6px">Sample questions for practice only; none are from the official exam. Not affiliated with or endorsed by PeopleCert. ITIL® is a registered trademark of PeopleCert.</p>`;
  app.innerHTML = html;
  app.querySelectorAll('[data-start]').forEach(b => b.onclick = () => start(+b.dataset.start));
  app.querySelectorAll('[data-study]').forEach(b => b.onclick = () => study(+b.dataset.study));
  document.getElementById('mock').onclick = () => startMock();
  document.getElementById('pShuf').onchange = e => { prefs.shuffleQ = e.target.checked; store.prefs = prefs; save(store); };
  document.getElementById('pTime').onchange = e => { prefs.timer = e.target.checked; store.prefs = prefs; save(store); };
  document.getElementById('reset').onclick = () => { if (confirm('Clear all saved scores?')) { store = {prefs}; save(store); home(); } };
  window.scrollTo(0, 0);
}

function build(items){
  return items.map(it => {
    const [q, right, wrongs, exp, src] = it;
    let opts = [right].concat(wrongs);
    opts = opts.every(isList) ? opts.slice().sort() : shuffle(opts);
    return {q, opts, ans: opts.indexOf(right), exp, src};
  });
}

function start(n, onlyIdx){
  const s = QB.sections[n-1];
  let items = s.items.map((it, i) => ({it, i}));
  if (onlyIdx) items = items.filter(x => onlyIdx.includes(x.i));
  if (prefs.shuffleQ) items = shuffle(items);
  const qs = build(items.map(x => x.it)).map((q, k) => Object.assign(q, {orig: items[k].i}));
  state = {mode: 'sec', n, title: `Section ${n}: ${s.title}`, qs, i: 0, picks: [], partial: !!onlyIdx};
  ask();
}

function startMock(){
  const all = [];
  QB.sections.forEach(s => s && s.items.forEach(it => all.push(Object.assign({}, {it, sec: s.n}))));
  const pick = shuffle(all).slice(0, 40);
  const qs = build(pick.map(x => x.it)).map((q, k) => Object.assign(q, {sec: pick[k].sec}));
  state = {mode: 'mock', title: 'Mock exam (random mix of all sections)', qs, i: 0, picks: []};
  ask();
}

function stopTimer(){ if (tick) { clearInterval(tick); tick = null; } }

function ask(){
  stopTimer();
  const q = state.qs[state.i], total = state.qs.length;
  state.left = TIME; state.done = false;
  const C = 2 * Math.PI * 20;
  app.innerHTML = `<div class="topbar"><button class="ghost" id="quit">← All sections</button>
    <div class="meta"><span>${esc(state.title)}</span>
    <span>Question <b>${state.i + 1}</b> of ${total}</span>
    <span>Score <b>${state.picks.filter(p => p.ok).length}</b></span></div></div>
    <div class="bar"><div style="width:${(state.i / total) * 100}%"></div></div>
    <div class="card qcard"><div class="qhead"><span class="eyebrow">Question ${state.i + 1}</span>
    ${prefs.timer ? `<div class="timer" id="tm"><svg width="46" height="46" viewBox="0 0 46 46"><circle class="trk" cx="23" cy="23" r="20" fill="none" stroke-width="2.5"/><circle class="val" id="tmv" cx="23" cy="23" r="20" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><span id="tms">60</span></div>` : ''}</div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${q.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div>
    <div class="actions"><span class="kbd">Press 1–4 or A–D to answer</span><button class="primary hidden" id="next">${state.i + 1 < total ? 'Next question &nbsp;→' : 'See results &nbsp;→'}</button></div></div>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  document.getElementById('quit').onclick = () => { if (confirm('Leave this quiz? Progress in this attempt will be lost.')) home(); };
  document.getElementById('next').onclick = next;
  if (prefs.timer) {
    tick = setInterval(() => {
      state.left--;
      const tm = document.getElementById('tm'), v = document.getElementById('tmv'), s = document.getElementById('tms');
      if (tm) {
        const left = Math.max(state.left, 0);
        s.textContent = left;
        v.style.strokeDashoffset = C * (1 - left / TIME);
        tm.classList.toggle('low', left <= 10);
      }
      if (state.left <= 0) answer(-1);
    }, 1000);
  }
  window.scrollTo(0, 0);
}

function answer(k){
  if (state.done) return;
  state.done = true; stopTimer();
  const q = state.qs[state.i], ok = k === q.ans;
  state.picks.push({k, ok});
  app.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if (j === q.ans) b.classList.add('correct');
    else if (j === k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const cls = k === -1 ? 'time' : ok ? 'good' : 'bad';
  const head = k === -1 ? `Time’s up. The answer is ${'ABCD'[q.ans]}.` : ok ? 'Correct.' : `Not quite. The answer is ${'ABCD'[q.ans]}.`;
  document.getElementById('fb').innerHTML = `<div class="fb ${cls}"><span class="t">${head}</span>
    <div class="why"><b>Why:</b> ${esc(q.exp)}</div><div class="src">Source · ${esc(q.src)}</div></div>`;
  const tm = document.getElementById('tm'); if (tm) tm.style.opacity = '.35';
  document.querySelector('.kbd').textContent = 'Press Enter to continue';
  const nx = document.getElementById('next'); nx.classList.remove('hidden'); nx.focus();
}

function next(){
  if (!state.done) return;
  if (state.i + 1 < state.qs.length) { state.i++; ask(); } else results();
}

function results(){
  stopTimer();
  const total = state.qs.length, score = state.picks.filter(p => p.ok).length;
  const pass = score >= Math.ceil(PASS * total);
  if (state.mode === 'sec' && !state.partial) {
    store.sec = store.sec || {};
    const st = store.sec[state.n] || {};
    st.attempts = (st.attempts || 0) + 1; st.last = score; st.best = Math.max(st.best || 0, score);
    store.sec[state.n] = st; save(store);
  }
  const missed = state.qs.map((q, i) => state.picks[i].ok ? null : q).filter(Boolean);
  let html = `<div class="topbar"><button class="ghost" id="home">← All sections</button><span class="meta">${esc(state.title)}</span></div>
  <div class="card score"><div class="eyebrow">Your result</div>
  <div class="big">${score}<small> / ${total}</small></div>
  <div class="verdict">${Math.round(score / total * 100)}% &nbsp;·&nbsp; ${pass ? '<span class="pill pass">Pass — 65% or more</span>' : '<span class="pill fail">Below the 65% pass mark</span>'}</div>
  <div class="row" style="justify-content:center">
    <button class="primary" id="again">Retake ${state.mode === 'mock' ? 'a new mock exam' : 'this section'}</button>
    ${missed.length && state.mode === 'sec' ? `<button id="missed">Practise the ${missed.length} I missed</button>` : ''}
  </div>
  <div class="row" style="justify-content:center;margin-top:18px"><label class="tog"><input type="checkbox" id="onlyWrong"> Show only the questions I got wrong</label></div>
  </div><div class="card revcard" id="rev">`;
  state.qs.forEach((q, i) => {
    const p = state.picks[i];
    const yours = p.k === -1 ? 'No answer (time ran out)' : `${'ABCD'[p.k]}. ${q.opts[p.k]}`;
    html += `<div class="rev ${p.ok ? 'r-ok' : 'r-no'}"><div class="q"><i>${i + 1}.</i>${esc(q.q)}</div>
      <div class="a ${p.ok ? 'ok' : 'no'}">${p.ok ? '✓' : '✗'} Your answer: ${esc(yours)}</div>
      ${p.ok ? '' : `<div class="a ok">✓ Correct answer: ${'ABCD'[q.ans]}. ${esc(q.opts[q.ans])}</div>`}
      <div class="e">${esc(q.exp)} <i>· ${esc(q.src)}${q.sec ? ', Section ' + q.sec : ''}</i></div></div>`;
  });
  html += '</div>';
  app.innerHTML = html;
  document.getElementById('home').onclick = home;
  document.getElementById('again').onclick = () => state.mode === 'mock' ? startMock() : start(state.n);
  const m = document.getElementById('missed');
  if (m) { const idx = missed.map(q => q.orig); const n = state.n; m.onclick = () => start(n, idx); }
  document.getElementById('onlyWrong').onchange = e => app.querySelectorAll('.r-ok').forEach(r => r.classList.toggle('hidden', e.target.checked));
  window.scrollTo(0, 0);
}

function study(n){
  stopTimer();
  const s = QB.sections[n-1];
  let html = `<div class="topbar"><button class="ghost" id="home">← All sections</button><button class="primary" id="go">Begin this section &nbsp;→</button></div>
  <div class="eyebrow">Section ${String(n).padStart(2, '0')} · Study answers</div>
  <h2 style="margin-top:8px">${esc(s.title)}</h2><p class="sub">${esc(s.refs)} · all ${s.items.length} questions with their answers</p><div class="card revcard">`;
  s.items.forEach((it, i) => {
    const [q, right, , exp, src] = it;
    html += `<div class="rev"><div class="q"><i>${i + 1}.</i>${esc(q)}</div><div class="a ok">✓ ${esc(right)}</div>
      <div class="e">${esc(exp)} <i>· ${esc(src)}</i></div></div>`;
  });
  app.innerHTML = html + '</div>';
  document.getElementById('home').onclick = home;
  document.getElementById('go').onclick = () => start(n);
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (!state || !document.querySelector('.opt')) return;
  const map = {'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
  const k = map[e.key.toLowerCase()];
  if (k != null && !state.done) answer(k);
  else if (e.key === 'Enter' && state.done) { e.preventDefault(); next(); }
});

home();
})();
</script>
</body>
</html>

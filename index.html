<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITIL v5 Foundation Quiz</title>
<meta name="description" content="Timed ITIL Foundation (Version 5) mock exams with explanations, topic tracking, review queue and flashcards.">
<meta name="theme-color" content="#41607a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ITIL v5 Exam">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  /* soft, low-glare light palette: no pure white, no pure black */
  --bg:#eceee8; --paper:#f6f6f1; --ink:#2f3540; --ink-2:#4a505c; --muted:#7d828b; --line:#dcdfd6; --line-2:#c9cdc2;
  --navy:#41607a; --navy-2:#4f6f8a; --gold:#9c8461; --gold-soft:#ebe5d8;
  --good:#4a7a5f; --good-bg:#e5eee6; --good-line:#bdd1c1;
  --bad:#a35d55; --bad-bg:#f1e4e1; --bad-line:#dcc0bb;
  --warn:#8f7440; --warn-bg:#f1ead9; --warn-line:#dccca4;
  --on-accent:#eef1ec; --chip:#e3e6de; --gold-2:#b7a07c; --key:#eef0ea; --hover:#f1f3ed; --fb:#f0f1eb;
  --sh1:rgba(47,53,64,.05); --sh2:rgba(47,53,64,.12); --sh3:rgba(47,53,64,.22);
  --serif:"Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:"Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --shadow:0 1px 2px var(--sh1), 0 8px 24px -12px var(--sh2);
  --shadow-lift:0 2px 4px var(--sh1), 0 16px 32px -14px var(--sh3);
}
/* soft dark palette: deep slate, not black; muted text, not white */
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1d2127; --paper:#252a31; --ink:#d8dbd5; --ink-2:#b4b8b2; --muted:#8b9199; --line:#333942; --line-2:#414853;
  --navy:#8eadc6; --navy-2:#a4c0d6; --gold:#c4aa7c; --gold-soft:#3a3428;
  --good:#8fbe9e; --good-bg:#24322a; --good-line:#3d5a47;
  --bad:#d89c94; --bad-bg:#3a2a28; --bad-line:#5f423e;
  --warn:#d3b67c; --warn-bg:#352f21; --warn-line:#5d4f31;
  --on-accent:#1d2127; --chip:#2e343c; --gold-2:#d9c49a; --key:#2b3038; --hover:#2a3038; --fb:#22272e;
  --sh1:rgba(0,0,0,.18); --sh2:rgba(0,0,0,.28); --sh3:rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{transition:background .25s,color .25s}
.theme-tog{position:absolute;top:16px;right:16px;z-index:10;width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);box-shadow:var(--shadow)}
.theme-tog svg{width:18px;height:18px}
.theme-tog .moon{display:block}.theme-tog .sun{display:none}
:root[data-theme="dark"] .theme-tog .moon{display:none}
:root[data-theme="dark"] .theme-tog .sun{display:block}
@media (max-width:640px){.theme-tog{top:10px;right:10px;width:36px;height:36px}}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:40px 16px 80px}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.005em;color:var(--ink)}
h1{font-size:clamp(2.1rem,5vw,3rem);line-height:1.05;margin:6px 0 10px}
h2{font-size:1.9rem;line-height:1.15;margin:0 0 6px}
.eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.rule{width:56px;height:2px;background:var(--gold);margin:18px 0 0;border:0}
.sub{color:var(--muted);margin:0 0 26px}
button{font:inherit;font-size:.92rem;cursor:pointer;border-radius:8px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);padding:9px 18px;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .15s}
button:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--navy);color:var(--on-accent);border-color:var(--navy);font-weight:500;letter-spacing:.01em}
button.primary:hover:not(:disabled){background:var(--navy-2);border-color:var(--navy-2);color:var(--on-accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding-left:4px}
button.ghost:hover:not(:disabled){color:var(--navy);border-color:transparent}
button:disabled{opacity:.5;cursor:default}

/* masthead */
.mast{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:26px}
.mast p{color:var(--ink-2);max-width:520px;margin:0}
.figs{display:flex;gap:28px}
.fig{text-align:right}
.fig b{display:block;font-family:var(--serif);font-size:2.3rem;font-weight:600;line-height:1;color:var(--navy)}
.fig span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.toolbar{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
.toolbar .spacer{flex:1}

/* section cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow)}
.sec{display:flex;flex-direction:column;position:relative;transition:box-shadow .2s,transform .2s,border-color .2s}
.sec:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);border-color:var(--line-2)}
.sec .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sec .num{font-family:var(--serif);font-size:2.6rem;line-height:.9;color:var(--gold);font-weight:500}
.sec .tag{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.sec h3{margin:14px 0 6px;font-size:1.38rem;line-height:1.2}
.sec .refs{font-size:.8rem;color:var(--muted);margin-bottom:16px;flex:1}
.sec .stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;padding-top:14px;border-top:1px solid var(--line)}
.sec .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.sec .row button{width:100%;height:42px;padding:0 10px;white-space:nowrap;display:flex;align-items:center;justify-content:center;font-size:.9rem;line-height:1}
.sec .num,.fig b,.big,.timer span,.rev .q i{font-variant-numeric:lining-nums tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.74rem;background:var(--chip);color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.pill.pass{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.pill.fail{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.pill.quiet{background:transparent;border-color:var(--line-2);color:var(--muted)}

/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:26px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .4s ease}
.timer{position:relative;width:46px;height:46px;flex:none}
.timer svg{transform:rotate(-90deg);display:block}
.timer .trk{stroke:var(--line)}
.timer .val{stroke:var(--navy);transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.low .val{stroke:var(--bad)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low span{color:var(--bad)}
.qcard{padding:34px 36px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.qtext{font-family:var(--serif);font-size:1.6rem;line-height:1.3;font-weight:600;white-space:pre-line;margin:0 0 26px;color:var(--ink)}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:16px;align-items:center;text-align:left;padding:15px 18px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:.98rem;line-height:1.5;color:var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-family:var(--serif);font-weight:600;font-size:1.05rem;color:var(--ink-2);background:var(--key);transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--navy);background:var(--hover);color:var(--ink);box-shadow:var(--shadow)}
.opt:hover:not(:disabled) .k{border-color:var(--navy);color:var(--navy)}
.opt.correct{border-color:var(--good-line);background:var(--good-bg)}
.opt.correct .k{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.opt:disabled{opacity:1;cursor:default}
.opt.dim{opacity:.55}
.fb{margin-top:22px;border-radius:10px;padding:18px 20px;border:1px solid var(--line);border-left-width:3px;background:var(--fb)}
.fb.good{border-left-color:var(--good)}
.fb.bad{border-left-color:var(--bad)}
.fb.time{border-left-color:var(--warn)}
.fb .t{display:block;font-family:var(--serif);font-size:1.35rem;font-weight:600;margin-bottom:6px}
.fb.good .t{color:var(--good)} .fb.bad .t{color:var(--bad)} .fb.time .t{color:var(--warn)}
.fb .why{color:var(--ink-2)}
.fb .why b{font-weight:600;color:var(--ink)}
.src{font-size:.74rem;letter-spacing:.04em;color:var(--muted);margin-top:10px;text-transform:uppercase}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.kbd{font-size:.76rem;color:var(--muted)}

/* results & study */
.score{text-align:center;padding:40px 24px}
.big{font-family:var(--serif);font-size:4.4rem;font-weight:600;line-height:1;margin:10px 0 8px;color:var(--navy)}
.big small{font-size:2rem;color:var(--muted);font-weight:500}
.verdict{display:flex;justify-content:center;gap:10px;align-items:center;color:var(--ink-2);margin-bottom:22px}
.revcard{margin-top:22px;padding:8px 32px}
.rev{border-top:1px solid var(--line);padding:22px 0}
.rev:first-child{border-top:0}
.rev .q{font-family:var(--serif);font-size:1.2rem;font-weight:600;line-height:1.35;white-space:pre-line}
.rev .q i{font-style:normal;color:var(--gold);margin-right:6px}
.rev .a{margin-top:8px;font-size:.92rem}
.rev .ok{color:var(--good)} .rev .no{color:var(--bad)}
.rev .e{margin-top:8px;font-size:.9rem;color:var(--ink-2);padding-left:14px;border-left:2px solid var(--line-2)}
.rev .e i{color:var(--muted);font-style:normal;font-size:.8rem}
.hint{font-size:.8rem;color:var(--muted);margin-top:30px;text-align:center}
.notice{font-size:.86rem;color:var(--ink-2);background:var(--warn-bg);border:1px solid var(--warn-line);border-left:3px solid var(--gold);border-radius:8px;padding:10px 14px;margin:-8px 0 24px}
.notice b{color:var(--ink);font-weight:600}
label.tog{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink-2);cursor:pointer}
label.tog input{accent-color:var(--navy);width:16px;height:16px}
.hidden{display:none}

/* ---------- exam simulation (live-exam style layout) ---------- */
body.exam .wrap{max-width:none;padding:0}
body.exam .theme-tog{display:none}
.xm{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh;background:var(--bg)}
.xm-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;background:var(--paper);border-bottom:1px solid var(--line)}
.xm-title b{display:block;font-size:.98rem;font-weight:600;color:var(--ink)}
.xm-title small{font-size:.78rem;color:var(--muted)}
.xm-tools{display:flex;align-items:center;gap:10px}
.xm-zoom{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.xm-zoom button{border:0;border-radius:0;padding:6px 11px;font-size:.82rem;background:var(--paper)}
.xm-zoom button+button{border-left:1px solid var(--line-2)}
.xm-time{display:flex;flex-direction:column;align-items:flex-end;padding:5px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--key);min-width:128px}
.xm-time span{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.xm-time b{font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.2}
.xm-time.low{border-color:var(--bad-line);background:var(--bad-bg)}
.xm-time.low b{color:var(--bad)}
.xm-body{display:grid;grid-template-columns:200px 1fr;min-height:0}
.xm-nav{border-right:1px solid var(--line);background:var(--paper);overflow-y:auto;padding:12px 10px 18px}
.xm-nav h4{margin:2px 6px 8px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.xm-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 6px 12px;font-size:.7rem;color:var(--muted)}
.xm-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line-2)}
.xm-legend .l-ans{background:var(--navy);border-color:var(--navy)}
.xm-legend .lg-flag{display:inline-flex;align-items:center;gap:4px}
.xm-legend .lg-flag .fi{width:12px;height:12px}
.xm-legend .lg-flag .cloth{fill:var(--warn);stroke:var(--warn)}
.fi{width:16px;height:16px;flex:none;display:block}
.fi path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.flagbtn{flex:none;width:28px;height:28px;padding:0;border-radius:6px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--muted)}
.flagbtn:hover:not(:disabled){color:var(--warn);border-color:var(--line-2)}
.flagbtn.on{color:var(--warn)}
.flagbtn.on .cloth,.xm-flag.on .cloth{fill:var(--warn)}
.xm-q{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:6px}
.xm-q button[data-go]{flex:1;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:6px;font-size:.84rem;border:1px solid transparent;background:transparent;color:var(--ink-2)}
.xm-q button[data-go] .st{width:9px;height:9px;border-radius:50%;border:1px solid var(--line-2)}
.xm-q.ans button[data-go] .st{background:var(--navy);border-color:var(--navy)}
.xm-q.flag button[data-go]{background:var(--warn-bg)}
.xm-q.cur button[data-go]{border-color:var(--navy);background:var(--hover);color:var(--ink);font-weight:600}
.xm-main{overflow-y:auto;padding:30px clamp(18px,4vw,56px) 40px}
.xm-qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.xm-qhead b{font-size:.95rem;font-weight:600}
.xm-flag{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;color:var(--ink-2);padding:7px 12px;border-radius:8px}
.xm-flag.on{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.xm-flag.on:hover:not(:disabled){color:var(--warn);border-color:var(--warn)}
.xm-stem{font-size:calc(1.08rem * var(--z,1));line-height:1.6;white-space:pre-line;margin:0 0 24px;color:var(--ink);max-width:860px}
.xm-opts{display:grid;gap:10px;max-width:860px}
.xo{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:calc(.98rem * var(--z,1));line-height:1.5;color:var(--ink)}
.xo .xl{flex:none;width:32px;height:32px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line-2);font-weight:600;background:var(--key);color:var(--ink-2)}
.xo:hover:not(.sel){border-color:var(--navy-2);color:var(--ink)}
.xo.sel{border-color:var(--navy);background:var(--hover);box-shadow:inset 3px 0 0 var(--navy)}
.xo.sel .xl{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.xo.correct{border-color:var(--good-line);background:var(--good-bg);cursor:default}
.xo.correct .xl{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.xo.wrong{border-color:var(--bad-line);background:var(--bad-bg);cursor:default}
.xo.wrong .xl{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.xo.dim{opacity:.55;cursor:default}
.xo.dim:hover,.xo.correct:hover,.xo.wrong:hover{color:var(--ink)}
.xm-main .fb{max-width:860px}
.xm-q.ok button[data-go] .st{background:var(--good);border-color:var(--good)}
.xm-q.no button[data-go] .st{background:var(--bad);border-color:var(--bad)}
.xm-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 22px;background:var(--paper);border-top:1px solid var(--line)}
.xm-foot .grp{display:flex;gap:10px;align-items:center}
.xm-foot .prog{font-size:.8rem;color:var(--muted)}
button.end{background:var(--bad);border-color:var(--bad);color:var(--on-accent);font-weight:500}
button.end:hover:not(:disabled){background:var(--bad);border-color:var(--bad);color:var(--on-accent);filter:brightness(1.08)}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);border:1px solid var(--line-2);border-radius:12px;max-width:460px;width:100%;padding:24px 24px 20px;box-shadow:var(--shadow-lift)}
.modal h3{font-family:var(--sans);font-size:1.1rem;font-weight:600;margin:0 0 10px}
.modal p{margin:0 0 10px;color:var(--ink-2);font-size:.93rem}
.modal .btns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.intro{max-width:720px;margin:0 auto}
.intro table{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:.92rem}
.intro td{padding:9px 0;border-bottom:1px solid var(--line)}
.intro td:first-child{color:var(--muted);width:42%}
.intro ol{padding-left:20px;margin:6px 0 0;color:var(--ink-2);font-size:.92rem}
.intro li{margin-bottom:6px}
.result-sheet{max-width:620px;margin:0 auto 20px;padding:0;overflow:hidden}
.result-sheet .rs-head{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.result-sheet table{width:100%;border-collapse:collapse;font-size:.93rem}
.result-sheet td{padding:11px 26px;border-bottom:1px solid var(--line)}
.result-sheet td:first-child{color:var(--muted);width:45%}
.result-sheet tr:last-child td{border-bottom:0}
.verdict-tag{display:inline-block;padding:3px 12px;border-radius:6px;font-weight:600;letter-spacing:.06em}
.verdict-tag.pass{background:var(--good-bg);color:var(--good);border:1px solid var(--good-line)}
.verdict-tag.fail{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
@media print{.theme-tog,.topbar,.noprint{display:none!important}body{background:#fff}}

/* ---------- dashboard, review, flashcards, search ---------- */
.fig small{font-size:1.2rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.86rem;margin:0}
button.wide{width:100%}
button.linkish{font-size:.8rem;padding:2px 4px;text-decoration:underline}
.gridtitle{font-size:1.5rem;margin:6px 0 14px}
.resume{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px;border-left:3px solid var(--navy)}
.resume b{display:block;margin:4px 0 2px}
.resume span{font-size:.84rem;color:var(--muted)}
.searchbar{display:flex;gap:10px;margin-bottom:20px}
.searchbar input{flex:1;min-width:0;font:inherit;font-size:.95rem;padding:10px 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink)}
.searchbar input:focus{outline:2px solid var(--gold);outline-offset:1px}
.dash{display:grid;grid-template-columns:1.25fr 0.8fr 1fr;gap:18px;margin-bottom:26px}
.dcard{display:flex;flex-direction:column;gap:12px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dhead h3{margin:0;font-size:1.3rem}
.dhead .ghost{font-size:.8rem;padding:4px 6px}
.rq{display:flex;align-items:baseline;gap:8px}
.rq b{font-family:var(--serif);font-size:2.8rem;line-height:1;color:var(--navy);font-weight:600;font-variant-numeric:lining-nums}
.rq span{color:var(--muted);font-size:.86rem}
.dcard .primary.wide{margin-top:auto}
.tlist{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 44px auto;grid-template-areas:"name name name" "bar pct go";gap:4px 10px;align-items:center}
.tname{grid-area:name;font-size:.86rem;color:var(--ink);line-height:1.35}
.tbar{grid-area:bar}.tpct{grid-area:pct}.tgo{grid-area:go}
.tid{display:inline-block;min-width:26px;color:var(--muted);font-variant-numeric:tabular-nums}
.tbar{position:relative;height:8px;border-radius:99px;background:var(--line)}
.tfill{height:100%;border-radius:99px;background:var(--navy)}
.tfill.low{background:var(--bad)}
.tpass{position:absolute;left:65%;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);opacity:.5;border-radius:2px}
.tpct{font-size:.84rem;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tgo{font-size:.76rem;padding:4px 10px}
.tmeta{font-size:.74rem;color:var(--muted);margin:-2px 0 6px}
.tcat{margin-bottom:16px}
.tcat h3{font-size:1.25rem;margin:0 0 14px}
.chartwrap{position:relative}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .cg{stroke:var(--line);stroke-width:1}
.chart .cl{fill:var(--muted);font-size:12px;font-family:var(--sans)}
.chart .cpass{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:4 3}
.chart .cline{fill:none;stroke:var(--navy);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .cdot{fill:var(--navy);stroke:var(--paper);stroke-width:2}
.chart .chit{fill:transparent;cursor:pointer}
.ctip{position:absolute;transform:translate(-50%,calc(-100% - 10px));background:var(--ink);color:var(--bg);font-size:.76rem;line-height:1.4;padding:7px 10px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
.ctip span{opacity:.75}
.tablecard{padding:0;overflow-x:auto}
.htable{width:100%;border-collapse:collapse;font-size:.86rem}
.htable th{text-align:left;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line)}
.htable td{padding:10px 16px;border-bottom:1px solid var(--line)}
.htable tr:last-child td{border-bottom:0}
.optbox{margin:0 0 16px;padding:12px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--key);align-items:flex-start!important}
.optbox input{margin-top:3px;flex:none}
.endrow{justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chips button{font-size:.8rem;padding:6px 12px;border-radius:99px}
.chips button.on{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.rvnote{color:var(--ink-2);font-size:.92rem;margin:0 0 16px;max-width:760px}
.rvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-bottom:24px;max-width:900px}
.rvt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:8px;text-align:left}
.rvt b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.rvt span{font-size:.74rem;color:var(--muted)}
.rvt .fi{position:absolute;top:9px;right:9px;color:var(--warn)}
.rvt .fi .cloth{fill:var(--warn)}
.rvt.un{border-style:dashed;border-color:var(--bad-line)}
.rvt.un span{color:var(--bad)}
.rvt.ans{border-color:var(--navy);box-shadow:inset 3px 0 0 var(--navy)}
.rvt.ok{box-shadow:inset 3px 0 0 var(--good);border-color:var(--good-line)}
.rvt.no{box-shadow:inset 3px 0 0 var(--bad);border-color:var(--bad-line)}
.rvt.fl{background:var(--warn-bg)}
.rv .endrow{max-width:900px}
.fcprog{font-size:.82rem;color:var(--muted);margin-bottom:10px;text-align:center}
.fcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;max-width:640px;min-height:260px;margin:0 auto;padding:30px 28px;border-radius:14px;background:var(--paper);border:1px solid var(--line-2);box-shadow:var(--shadow-lift);text-align:center}
.fcard:hover:not(:disabled){color:var(--ink);border-color:var(--navy)}
.fcard.flip{border-color:var(--gold)}
.fctag{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.fcterm{font-family:var(--serif);font-size:1.9rem;font-weight:600;line-height:1.2;color:var(--ink)}
.fcdef{font-size:1.02rem;line-height:1.6;color:var(--ink-2);max-width:520px;border-top:1px solid var(--line);padding-top:14px}
.fchint{font-size:.82rem;color:var(--muted)}
.fcbtns{display:flex;justify-content:center;gap:12px;max-width:640px;margin:18px auto 0}
.fcbtns button{flex:1;height:46px}
.fcdone{max-width:640px;margin:0 auto;text-align:center;padding:34px 24px}
.fcdone h3{font-size:1.6rem;margin:0 0 8px}
mark{background:var(--warn-bg);color:var(--ink);border-radius:3px;padding:0 2px;box-shadow:0 0 0 1px var(--warn-line)}
@media (max-width:900px){ .dash{grid-template-columns:1fr 1fr} .dash .dcard:first-child{grid-column:1 / -1} }
@media (max-width:760px){
  /* exam screen */
  .xm-top{padding:10px 14px;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
  .xm-title b{font-size:.88rem;line-height:1.3}
  .xm-title small{display:block;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .xm-zoom{display:none}
  .xm-time{min-width:0;padding:4px 10px}
  .xm-time span{font-size:.58rem}
  .xm-time b{font-size:1.05rem}
  .xm-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .xm-nav{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:8px 12px;white-space:nowrap;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .xm-nav::-webkit-scrollbar{display:none}
  .xm-nav h4,.xm-legend{display:none}
  .xm-q{flex-direction:column;align-items:center;gap:4px;padding:0;scroll-snap-align:center}
  .flagbtn{width:32px;height:26px}
  .xm-q button[data-go]{flex:none;min-width:40px;height:36px;padding:0 8px;justify-content:center;border:1px solid var(--line);background:var(--paper);font-variant-numeric:tabular-nums}
  .xm-q button[data-go] .st,.xm-q .qlbl{display:none}
  .xm-q.ans button[data-go]{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
  .xm-q.flag button[data-go]{box-shadow:inset 0 -3px 0 var(--warn)}
  .xm-q.ok button[data-go]{background:var(--good);border-color:var(--good)}
  .xm-q.no button[data-go]{background:var(--bad);border-color:var(--bad)}
  .xm-q.cur button[data-go]{outline:2px solid var(--gold);outline-offset:1px}
  .xm-main{padding:18px 16px 28px}
  .xm-qhead{margin-bottom:16px;padding-bottom:12px}
  .xm-stem{font-size:calc(1.02rem * var(--z,1));margin-bottom:18px}
  .xo{padding:12px;gap:12px;min-height:52px}
  .xo .xl{width:30px;height:30px}
  .xm-foot{display:grid;grid-template-columns:auto auto 1fr;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .xm-foot .grp{display:contents}
  .xm-foot .prog{display:none}
  .xm-foot button{height:44px;padding:0 14px}
  #xend{grid-column:1;grid-row:1}
  #xprev{grid-column:2;grid-row:1}
  #xnext{grid-column:3;grid-row:1}
  #xexit{grid-column:1 / -1;grid-row:2;height:auto;padding:2px;font-size:.8rem;color:var(--muted);justify-self:center}
  .xm-foot .lbl{display:none}
}
@media (max-width:640px){
  .wrap{padding:22px 16px 56px}
  /* home */
  .mast{grid-template-columns:1fr;gap:18px;padding-bottom:22px;margin-bottom:20px;padding-right:44px}
  .mast p{font-size:.93rem}
  .figs{gap:22px;justify-content:space-between;padding-right:0}.fig{text-align:left}
  .fig b{font-size:1.9rem}
  .notice{margin:-4px 0 18px;font-size:.84rem}
  .toolbar{gap:12px;margin-bottom:20px}
  .toolbar .spacer{display:none}
  #mock{width:100%;height:46px}
  .grid{grid-template-columns:1fr;gap:14px}
  .card{padding:18px}
  .sec:hover{transform:none}
  .sec h3{font-size:1.25rem;margin-top:10px}
  .sec .refs{margin-bottom:12px}
  .sec .row button{height:44px}
  /* intro, study, results */
  h2{font-size:1.55rem}
  .intro .card{padding:16px 18px!important}
  .intro td{display:block;width:auto!important;padding:2px 0}
  .intro tr{display:block;padding:8px 0;border-bottom:1px solid var(--line)}
  .intro td{border:0}
  .intro .row{flex-direction:column-reverse}
  .intro .row button{width:100%;height:46px}
  .topbar{padding-right:46px}
  .topbar .meta{font-size:.76rem}
  .topbar .primary{padding:8px 14px}
  .result-sheet .rs-head{padding:16px 18px}
  .result-sheet tr{display:block;padding:9px 18px;border-bottom:1px solid var(--line)}
  .result-sheet tr:last-child{border-bottom:0}
  .result-sheet td{display:block;width:auto!important;padding:1px 0;border:0}
  .result-sheet td:first-child{font-size:.78rem}
  .result-sheet .rs-head b{font-size:.98rem!important}
  .score .row{flex-direction:column}
  .score .row button{width:100%;height:46px}
  .revcard{padding:4px 18px}
  .rev .q{font-size:1.1rem}
  .dash{grid-template-columns:1fr;gap:14px}
  .resume .row{width:100%}
  .resume .row button{flex:1;height:44px}
  .searchbar button{padding:0 14px}
  .rvgrid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .rv .endrow{flex-direction:column-reverse}
  .rv .endrow button{width:100%;height:46px}
  .fcard{min-height:230px;padding:24px 18px}
  .fcterm{font-size:1.55rem}
  .htable th:nth-child(1),.htable td:nth-child(1){display:none}
  .modal{padding:20px 18px 16px}
  .modal .btns{flex-direction:column-reverse}
  .modal .btns button{width:100%;height:46px}
}
</style>

<script>
// Apply the saved theme before the page draws, so there is no flash. Light is the default.
(function(){ var t = 'light'; try { t = localStorage.getItem('itil5quiz.theme') || 'light'; } catch(e){} document.documentElement.setAttribute('data-theme', t); })();
</script>
<button class="theme-tog" id="themeTog" title="Switch light / dark mode" aria-label="Switch light or dark mode">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
</button>
<script>
document.getElementById('themeTog').onclick = function(){
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('itil5quiz.theme', next); } catch(e){}
};
</script>

<script>

window.QB = { sections: [], add(n, title, refs, items){ this.sections[n-1] = {n, title, refs, items}; } };
</script>

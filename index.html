<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITIL v5 Foundation Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  /* soft, low-glare light palette: no pure white, no pure black */
  --bg:#eceee8; --paper:#f6f6f1; --ink:#2f3540; --ink-2:#4a505c; --muted:#7d828b; --line:#dcdfd6; --line-2:#c9cdc2;
  --navy:#41607a; --navy-2:#4f6f8a; --gold:#9c8461; --gold-soft:#ebe5d8;
  --good:#4a7a5f; --good-bg:#e5eee6; --good-line:#bdd1c1;
  --bad:#a35d55; --bad-bg:#f1e4e1; --bad-line:#dcc0bb;
  --warn:#8f7440; --warn-bg:#f1ead9; --warn-line:#dccca4;
  --on-accent:#eef1ec; --chip:#e3e6de; --gold-2:#b7a07c; --key:#eef0ea; --hover:#f1f3ed; --fb:#f0f1eb;
  --sh1:rgba(47,53,64,.05); --sh2:rgba(47,53,64,.12); --sh3:rgba(47,53,64,.22);
  --serif:"Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:"Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --shadow:0 1px 2px var(--sh1), 0 8px 24px -12px var(--sh2);
  --shadow-lift:0 2px 4px var(--sh1), 0 16px 32px -14px var(--sh3);
}
/* soft dark palette: deep slate, not black; muted text, not white */
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1d2127; --paper:#252a31; --ink:#d8dbd5; --ink-2:#b4b8b2; --muted:#8b9199; --line:#333942; --line-2:#414853;
  --navy:#8eadc6; --navy-2:#a4c0d6; --gold:#c4aa7c; --gold-soft:#3a3428;
  --good:#8fbe9e; --good-bg:#24322a; --good-line:#3d5a47;
  --bad:#d89c94; --bad-bg:#3a2a28; --bad-line:#5f423e;
  --warn:#d3b67c; --warn-bg:#352f21; --warn-line:#5d4f31;
  --on-accent:#1d2127; --chip:#2e343c; --gold-2:#d9c49a; --key:#2b3038; --hover:#2a3038; --fb:#22272e;
  --sh1:rgba(0,0,0,.18); --sh2:rgba(0,0,0,.28); --sh3:rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{transition:background .25s,color .25s}
.theme-tog{position:fixed;top:16px;right:16px;z-index:10;width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line-2);color:var(--ink-2);box-shadow:var(--shadow)}
.theme-tog svg{width:18px;height:18px}
.theme-tog .moon{display:block}.theme-tog .sun{display:none}
:root[data-theme="dark"] .theme-tog .moon{display:none}
:root[data-theme="dark"] .theme-tog .sun{display:block}
@media (max-width:640px){.theme-tog{top:10px;right:10px;width:36px;height:36px}}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:40px 16px 80px}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.005em;color:var(--ink)}
h1{font-size:clamp(2.1rem,5vw,3rem);line-height:1.05;margin:6px 0 10px}
h2{font-size:1.9rem;line-height:1.15;margin:0 0 6px}
.eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.rule{width:56px;height:2px;background:var(--gold);margin:18px 0 0;border:0}
.sub{color:var(--muted);margin:0 0 26px}
button{font:inherit;font-size:.92rem;cursor:pointer;border-radius:8px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);padding:9px 18px;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .15s}
button:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--navy);color:var(--on-accent);border-color:var(--navy);font-weight:500;letter-spacing:.01em}
button.primary:hover:not(:disabled){background:var(--navy-2);border-color:var(--navy-2);color:var(--on-accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding-left:4px}
button.ghost:hover:not(:disabled){color:var(--navy);border-color:transparent}
button:disabled{opacity:.5;cursor:default}

/* masthead */
.mast{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:26px}
.mast p{color:var(--ink-2);max-width:520px;margin:0}
.figs{display:flex;gap:28px}
.fig{text-align:right}
.fig b{display:block;font-family:var(--serif);font-size:2.3rem;font-weight:600;line-height:1;color:var(--navy)}
.fig span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.toolbar{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:28px}
.toolbar .spacer{flex:1}

/* section cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow)}
.sec{display:flex;flex-direction:column;position:relative;transition:box-shadow .2s,transform .2s,border-color .2s}
.sec:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);border-color:var(--line-2)}
.sec .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sec .num{font-family:var(--serif);font-size:2.6rem;line-height:.9;color:var(--gold);font-weight:500}
.sec .tag{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.sec h3{margin:14px 0 6px;font-size:1.38rem;line-height:1.2}
.sec .refs{font-size:.8rem;color:var(--muted);margin-bottom:16px;flex:1}
.sec .stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;padding-top:14px;border-top:1px solid var(--line)}
.sec .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.sec .row button{width:100%;height:42px;padding:0 10px;white-space:nowrap;display:flex;align-items:center;justify-content:center;font-size:.9rem;line-height:1}
.sec .num,.fig b,.big,.timer span,.rev .q i{font-variant-numeric:lining-nums tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.74rem;background:var(--chip);color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.pill.pass{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.pill.fail{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.pill.quiet{background:transparent;border-color:var(--line-2);color:var(--muted)}

/* quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:26px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .4s ease}
.timer{position:relative;width:46px;height:46px;flex:none}
.timer svg{transform:rotate(-90deg);display:block}
.timer .trk{stroke:var(--line)}
.timer .val{stroke:var(--navy);transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.low .val{stroke:var(--bad)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low span{color:var(--bad)}
.qcard{padding:34px 36px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.qtext{font-family:var(--serif);font-size:1.6rem;line-height:1.3;font-weight:600;white-space:pre-line;margin:0 0 26px;color:var(--ink)}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:16px;align-items:center;text-align:left;padding:15px 18px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:.98rem;line-height:1.5;color:var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-family:var(--serif);font-weight:600;font-size:1.05rem;color:var(--ink-2);background:var(--key);transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--navy);background:var(--hover);color:var(--ink);box-shadow:var(--shadow)}
.opt:hover:not(:disabled) .k{border-color:var(--navy);color:var(--navy)}
.opt.correct{border-color:var(--good-line);background:var(--good-bg)}
.opt.correct .k{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.opt:disabled{opacity:1;cursor:default}
.opt.dim{opacity:.55}
.fb{margin-top:22px;border-radius:10px;padding:18px 20px;border:1px solid var(--line);border-left-width:3px;background:var(--fb)}
.fb.good{border-left-color:var(--good)}
.fb.bad{border-left-color:var(--bad)}
.fb.time{border-left-color:var(--warn)}
.fb .t{display:block;font-family:var(--serif);font-size:1.35rem;font-weight:600;margin-bottom:6px}
.fb.good .t{color:var(--good)} .fb.bad .t{color:var(--bad)} .fb.time .t{color:var(--warn)}
.fb .why{color:var(--ink-2)}
.fb .why b{font-weight:600;color:var(--ink)}
.src{font-size:.74rem;letter-spacing:.04em;color:var(--muted);margin-top:10px;text-transform:uppercase}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.kbd{font-size:.76rem;color:var(--muted)}

/* results & study */
.score{text-align:center;padding:40px 24px}
.big{font-family:var(--serif);font-size:4.4rem;font-weight:600;line-height:1;margin:10px 0 8px;color:var(--navy)}
.big small{font-size:2rem;color:var(--muted);font-weight:500}
.verdict{display:flex;justify-content:center;gap:10px;align-items:center;color:var(--ink-2);margin-bottom:22px}
.revcard{margin-top:22px;padding:8px 32px}
.rev{border-top:1px solid var(--line);padding:22px 0}
.rev:first-child{border-top:0}
.rev .q{font-family:var(--serif);font-size:1.2rem;font-weight:600;line-height:1.35;white-space:pre-line}
.rev .q i{font-style:normal;color:var(--gold);margin-right:6px}
.rev .a{margin-top:8px;font-size:.92rem}
.rev .ok{color:var(--good)} .rev .no{color:var(--bad)}
.rev .e{margin-top:8px;font-size:.9rem;color:var(--ink-2);padding-left:14px;border-left:2px solid var(--line-2)}
.rev .e i{color:var(--muted);font-style:normal;font-size:.8rem}
.hint{font-size:.8rem;color:var(--muted);margin-top:30px;text-align:center}
.notice{font-size:.86rem;color:var(--ink-2);background:var(--warn-bg);border:1px solid var(--warn-line);border-left:3px solid var(--gold);border-radius:8px;padding:10px 14px;margin:-8px 0 24px}
.notice b{color:var(--ink);font-weight:600}
label.tog{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink-2);cursor:pointer}
label.tog input{accent-color:var(--navy);width:16px;height:16px}
.hidden{display:none}

/* ---------- exam simulation (live-exam style layout) ---------- */
body.exam .wrap{max-width:none;padding:0}
body.exam .theme-tog{display:none}
.xm{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh;background:var(--bg)}
.xm-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;background:var(--paper);border-bottom:1px solid var(--line)}
.xm-title b{display:block;font-size:.98rem;font-weight:600;color:var(--ink)}
.xm-title small{font-size:.78rem;color:var(--muted)}
.xm-tools{display:flex;align-items:center;gap:10px}
.xm-zoom{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.xm-zoom button{border:0;border-radius:0;padding:6px 11px;font-size:.82rem;background:var(--paper)}
.xm-zoom button+button{border-left:1px solid var(--line-2)}
.xm-time{display:flex;flex-direction:column;align-items:flex-end;padding:5px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--key);min-width:128px}
.xm-time span{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.xm-time b{font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.2}
.xm-time.low{border-color:var(--bad-line);background:var(--bad-bg)}
.xm-time.low b{color:var(--bad)}
.xm-body{display:grid;grid-template-columns:200px 1fr;min-height:0}
.xm-nav{border-right:1px solid var(--line);background:var(--paper);overflow-y:auto;padding:12px 10px 18px}
.xm-nav h4{margin:2px 6px 8px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.xm-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 6px 12px;font-size:.7rem;color:var(--muted)}
.xm-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line-2)}
.xm-legend .l-ans{background:var(--navy);border-color:var(--navy)}
.xm-legend .lg-flag{display:inline-flex;align-items:center;gap:4px}
.xm-legend .lg-flag .fi{width:12px;height:12px}
.xm-legend .lg-flag .cloth{fill:var(--warn);stroke:var(--warn)}
.fi{width:16px;height:16px;flex:none;display:block}
.fi path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.flagbtn{flex:none;width:28px;height:28px;padding:0;border-radius:6px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--muted)}
.flagbtn:hover:not(:disabled){color:var(--warn);border-color:var(--line-2)}
.flagbtn.on{color:var(--warn)}
.flagbtn.on .cloth,.xm-flag.on .cloth{fill:var(--warn)}
.xm-q{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:6px}
.xm-q button[data-go]{flex:1;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:6px;font-size:.84rem;border:1px solid transparent;background:transparent;color:var(--ink-2)}
.xm-q button[data-go] .st{width:9px;height:9px;border-radius:50%;border:1px solid var(--line-2)}
.xm-q.ans button[data-go] .st{background:var(--navy);border-color:var(--navy)}
.xm-q.flag button[data-go]{background:var(--warn-bg)}
.xm-q.cur button[data-go]{border-color:var(--navy);background:var(--hover);color:var(--ink);font-weight:600}
.xm-main{overflow-y:auto;padding:30px clamp(18px,4vw,56px) 40px}
.xm-qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.xm-qhead b{font-size:.95rem;font-weight:600}
.xm-flag{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;color:var(--ink-2);padding:7px 12px;border-radius:8px}
.xm-flag.on{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.xm-flag.on:hover:not(:disabled){color:var(--warn);border-color:var(--warn)}
.xm-stem{font-size:calc(1.08rem * var(--z,1));line-height:1.6;white-space:pre-line;margin:0 0 24px;color:var(--ink);max-width:860px}
.xm-opts{display:grid;gap:10px;max-width:860px}
.xo{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:calc(.98rem * var(--z,1));line-height:1.5;color:var(--ink)}
.xo .xl{flex:none;width:32px;height:32px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line-2);font-weight:600;background:var(--key);color:var(--ink-2)}
.xo:hover:not(.sel){border-color:var(--navy-2);color:var(--ink)}
.xo.sel{border-color:var(--navy);background:var(--hover);box-shadow:inset 3px 0 0 var(--navy)}
.xo.sel .xl{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.xo.correct{border-color:var(--good-line);background:var(--good-bg);cursor:default}
.xo.correct .xl{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.xo.wrong{border-color:var(--bad-line);background:var(--bad-bg);cursor:default}
.xo.wrong .xl{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.xo.dim{opacity:.55;cursor:default}
.xo.dim:hover,.xo.correct:hover,.xo.wrong:hover{color:var(--ink)}
.xm-main .fb{max-width:860px}
.xm-q.ok button[data-go] .st{background:var(--good);border-color:var(--good)}
.xm-q.no button[data-go] .st{background:var(--bad);border-color:var(--bad)}
.xm-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 22px;background:var(--paper);border-top:1px solid var(--line)}
.xm-foot .grp{display:flex;gap:10px;align-items:center}
.xm-foot .prog{font-size:.8rem;color:var(--muted)}
button.end{background:var(--bad);border-color:var(--bad);color:var(--on-accent);font-weight:500}
button.end:hover:not(:disabled){background:var(--bad);border-color:var(--bad);color:var(--on-accent);filter:brightness(1.08)}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);border:1px solid var(--line-2);border-radius:12px;max-width:460px;width:100%;padding:24px 24px 20px;box-shadow:var(--shadow-lift)}
.modal h3{font-family:var(--sans);font-size:1.1rem;font-weight:600;margin:0 0 10px}
.modal p{margin:0 0 10px;color:var(--ink-2);font-size:.93rem}
.modal .btns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.intro{max-width:720px;margin:0 auto}
.intro table{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:.92rem}
.intro td{padding:9px 0;border-bottom:1px solid var(--line)}
.intro td:first-child{color:var(--muted);width:42%}
.intro ol{padding-left:20px;margin:6px 0 0;color:var(--ink-2);font-size:.92rem}
.intro li{margin-bottom:6px}
.result-sheet{max-width:620px;margin:0 auto 20px;padding:0;overflow:hidden}
.result-sheet .rs-head{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.result-sheet table{width:100%;border-collapse:collapse;font-size:.93rem}
.result-sheet td{padding:11px 26px;border-bottom:1px solid var(--line)}
.result-sheet td:first-child{color:var(--muted);width:45%}
.result-sheet tr:last-child td{border-bottom:0}
.verdict-tag{display:inline-block;padding:3px 12px;border-radius:6px;font-weight:600;letter-spacing:.06em}
.verdict-tag.pass{background:var(--good-bg);color:var(--good);border:1px solid var(--good-line)}
.verdict-tag.fail{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
@media print{.theme-tog,.topbar,.noprint{display:none!important}body{background:#fff}}
@media (max-width:760px){
  /* exam screen */
  .xm-top{padding:10px 14px;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
  .xm-title b{font-size:.88rem;line-height:1.3}
  .xm-title small{display:block;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .xm-zoom{display:none}
  .xm-time{min-width:0;padding:4px 10px}
  .xm-time span{font-size:.58rem}
  .xm-time b{font-size:1.05rem}
  .xm-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .xm-nav{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:8px 12px;white-space:nowrap;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .xm-nav::-webkit-scrollbar{display:none}
  .xm-nav h4,.xm-legend{display:none}
  .xm-q{flex-direction:column;align-items:center;gap:4px;padding:0;scroll-snap-align:center}
  .flagbtn{width:32px;height:26px}

<body>
<script>

(function(){ var t = 'light'; try { t = localStorage.getItem('itil5quiz.theme') || 'light'; } catch(e){} document.documentElement.setAttribute('data-theme', t); })();
</script>
<button class="theme-tog" id="themeTog" title="Switch light / dark mode" aria-label="Switch light or dark mode">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
</button>

};
</script>
<div class="wrap" id="app"></div>

<script>
// Question bank registry. Each questions/sNN.js file calls QB.add(...).
// Item format: [question, correctAnswer, [wrong1, wrong2, wrong3], explanation, source]
window.QB = { sections: [], add(n, title, refs, items){ this.sections[n-1] = {n, title, refs, items}; } };

<script>
(function(){
const PASS = 0.65, KEY = 'itil5quiz.v1';
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isList = o => /^\d and \d$/.test(o);

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} }
let store = load();
let prefs = Object.assign({shuffleQ: true, feedback: true}, store.prefs || {});

let state = null, tick = null;

function home(){
  stopTimer();
  document.body.classList.remove('exam');
  closeModal();
  const secs = QB.sections.filter(Boolean);
  const total = secs.reduce((s, x) => s + x.items.length, 0);
  const done = secs.filter(s => ((store.sec || {})[s.n] || {}).best != null);
  const passed = done.filter(s => store.sec[s.n].best >= PASS * s.items.length).length;
  let html = `<header class="mast"><div>
    <div class="eyebrow">ITIL® Foundation · Version 5</div>
    <h1>Exam Practice Studio</h1>
    <p>Each section is a timed exam simulation in the style of the live online exam: 40 questions, 60 minutes, a question menu with flags, and your result at the end, followed by a full review with explanations. Pass mark 65% (26 of 40).</p>
    <hr class="rule"></div>
    <div class="figs">
      <div class="fig"><b>${secs.length}</b><span>Sections</span></div>
      <div class="fig"><b>${total}</b><span>Questions</span></div>
      <div class="fig"><b>${passed}<small style="font-size:1.2rem;color:var(--muted)">/${secs.length}</small></b><span>Passed</span></div>
    </div></header>
  <div class="notice" role="note"><b>For practice only.</b> Every question here is an original sample question written for revision. None are taken from, or represent, the official ITIL® Foundation (Version 5) exam.</div>
  <div class="toolbar">
    <label class="tog"><input type="checkbox" id="pShuf" ${prefs.shuffleQ ? 'checked' : ''}> Shuffle question order</label>
    <label class="tog"><input type="checkbox" id="pFb" ${prefs.feedback ? 'checked' : ''}> Show correct answer after each question</label>
    <span class="spacer"></span>
    <button id="mock" class="primary">Full mock exam (all topics) &nbsp;→</button>
  </div><div class="grid">`;
  secs.forEach(s => {
    const st = (store.sec || {})[s.n] || {};
    const best = st.best != null ? `<span class="pill ${st.best >= PASS * s.items.length ? 'pass' : 'fail'}">Best ${st.best}/${s.items.length}</span>` : '<span class="pill quiet">Not yet attempted</span>';
    const last = st.last != null ? `<span class="pill">Last ${st.last}/${s.items.length}</span>` : '';
    const att = st.attempts ? `<span class="pill">${st.attempts} attempt${st.attempts > 1 ? 's' : ''}</span>` : '';
    html += `<div class="card sec"><div class="head"><div class="num">${String(s.n).padStart(2, '0')}</div><div class="tag">${s.items.length} questions</div></div>
      <h3>${esc(s.title)}</h3>
      <div class="refs">${esc(s.refs)}</div><div class="stats">${best}${last}${att}</div>
      <div class="row"><button class="primary" data-exam="${s.n}" title="Timed exam simulation">Start exam</button><button data-study="${s.n}" title="Read all questions and answers">Study</button></div></div>`;
  });
  html += `</div><p class="hint">In the exam: 1–4 or A–D to answer, ← → to move between questions, F to flag. Scores are saved in this browser only. ·
  <button id="reset" class="ghost" style="font-size:.8rem;padding:2px 4px;text-decoration:underline">Reset scores</button></p>
  <p class="hint" style="margin-top:6px">Sample questions for practice only; none are from the official exam. Not affiliated with or endorsed by PeopleCert. ITIL® is a registered trademark of PeopleCert.</p>`;
  app.innerHTML = html;
  app.querySelectorAll('[data-exam]').forEach(b => b.onclick = () => startExam(+b.dataset.exam));
  app.querySelectorAll('[data-study]').forEach(b => b.onclick = () => study(+b.dataset.study));
  document.getElementById('mock').onclick = () => startMock();
  document.getElementById('pShuf').onchange = e => { prefs.shuffleQ = e.target.checked; store.prefs = prefs; save(store); };
  document.getElementById('pFb').onchange = e => { prefs.feedback = e.target.checked; store.prefs = prefs; save(store); };
  document.getElementById('reset').onclick = () => { if (confirm('Clear all saved scores?')) { store = {prefs}; save(store); home(); } };
  window.scrollTo(0, 0);
}

function build(items){
  return items.map(it => {
    const [q, right, wrongs, exp, src] = it;
    let opts = [right].concat(wrongs);
    opts = opts.every(isList) ? opts.slice().sort() : shuffle(opts);
    return {q, opts, ans: opts.indexOf(right), exp, src};
  });
}

function startMock(){
  const all = [];
  QB.sections.forEach(s => s && s.items.forEach(it => all.push(Object.assign({}, {it, sec: s.n}))));
  const pick = shuffle(all).slice(0, 40);
  const qs = build(pick.map(x => x.it)).map((q, k) => Object.assign(q, {sec: pick[k].sec}));
  state = {kind: 'exam', mode: 'mock', title: 'Full mock exam (all topics)', qs};
  examIntro();
}

/* ---------- Exam simulation ---------- */
const EXAM_SECS_PER_Q = 90;            // 60 minutes for 40 questions
const FLAG = `<svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><path class="pole" d="M5 21V4"/><path class="cloth" d="M5 4h11l-2.2 4L16 12H5"/></svg>`;
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

function startExam(n, onlyIdx){
  const s = QB.sections[n-1];
  let items = s.items.map((it, i) => ({it, i}));
  if (onlyIdx) items = items.filter(x => onlyIdx.includes(x.i));
  if (prefs.shuffleQ) items = shuffle(items);
  const qs = build(items.map(x => x.it)).map((q, k) => Object.assign(q, {orig: items[k].i}));
  const title = onlyIdx ? `Section ${n}: ${s.title} (missed questions)` : `Section ${n}: ${s.title}`;
  state = {kind: 'exam', mode: 'sec', n, title, qs, partial: !!onlyIdx};
  examIntro();
}

function examIntro(){
  stopTimer();
  document.body.classList.remove('exam');
  const n = state.qs.length, mins = Math.round(n * EXAM_SECS_PER_Q / 60), need = Math.ceil(PASS * n);
  app.innerHTML = `<div class="topbar"><button class="ghost" id="back">← All sections</button></div>
  <div class="intro"><div class="eyebrow">Exam information</div>
  <h2 style="margin:8px 0 14px">ITIL® Foundation (Version 5) – Practice Exam</h2>
  <div class="card" style="padding:22px 26px">
    <table>
      <tr><td>Paper</td><td>${esc(state.title)}</td></tr>
      <tr><td>Number of questions</td><td>${n} multiple choice, 1 mark each</td></tr>
      <tr><td>Duration</td><td>${mins} minutes</td></tr>
      <tr><td>Pass mark</td><td>${need} of ${n} (65%)</td></tr>
      <tr><td>Materials allowed</td><td>None (closed book)</td></tr>
      <tr><td>Negative marking</td><td>No</td></tr>
    </table>
    <label class="tog" style="margin:0 0 16px;padding:12px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--key)">
      <input type="checkbox" id="iFb" ${prefs.feedback ? 'checked' : ''}>
      <span><b>Show the correct answer and explanation after each question.</b> Untick this for a strict simulation where answers are only revealed at the end, like the real exam.</span></label>
    <b style="font-size:.92rem">How the exam screen works</b>
    <ol>
      <li>The menu on the left lists the question numbers. Click a number, or use <b>Next</b> and <b>Previous</b>, to move between questions. The current question is highlighted.</li>
      <li>Click the letter of an answer to choose it. With answer feedback on, your answer is locked and the correct answer and explanation appear straight away. With it off, you can change your answer at any time before ending the exam.</li>
      <li>Click the flag icon next to a question number (or “Flag for review” above the question) to mark it to come back to. The flag turns amber when set; click it again to remove it. You can flag as many questions as you like.</li>
      <li>The countdown timer is in the top right. A reminder appears when 15 minutes are left, and the exam ends automatically when time runs out.</li>
      <li>Click <b>End Exam</b> (bottom right) when you have finished. Unanswered questions are marked as incorrect, and you cannot change answers after you end the exam.</li>
      <li>You get your provisional result straight away, followed by a full review with explanations.</li>
    </ol>
  </div>
  <p class="notice" style="margin:16px 0">This is a practice simulation. All questions are original sample questions and none are from the official exam.</p>
  <div class="row" style="justify-content:flex-end"><button id="back2">Cancel</button><button class="primary" id="go">Start exam &nbsp;→</button></div></div>`;
  document.getElementById('back').onclick = home;
  document.getElementById('back2').onclick = home;
  document.getElementById('go').onclick = examBegin;
  document.getElementById('iFb').onchange = e => { prefs.feedback = e.target.checked; store.prefs = prefs; save(store); };
  window.scrollTo(0, 0);
}

function examBegin(){
  const n = state.qs.length;
  Object.assign(state, {i: 0, sel: Array(n).fill(-1), flag: Array(n).fill(false), left: n * EXAM_SECS_PER_Q, warned: false, over: false, fb: !!prefs.feedback});
  document.body.classList.add('exam');
  examRender();
  tick = setInterval(examTick, 1000);
}

function examTick(){
  if (state.over) return;
  state.left--;
  const t = document.getElementById('xt'), box = document.getElementById('xtb');
  if (t) { t.textContent = fmt(Math.max(state.left, 0)); box.classList.toggle('low', state.left <= 300); }
  if (!state.warned && state.left === 900 && state.qs.length * EXAM_SECS_PER_Q > 900) {
    state.warned = true;
    modal('15 minutes remaining', '<p>You have 15 minutes left to complete your exam.</p>', [{label: 'Continue', primary: true}]);
  }
  if (state.left <= 0) {
    examSubmit();
    modal('Time is up', '<p>The exam time has ended and your answers have been submitted automatically.</p>', [{label: 'View result', primary: true}]);
  }
}

function examPick(k){
  if (state.over) return;
  if (state.fb && state.sel[state.i] >= 0) return;   // locked once answered when feedback is on
  state.sel[state.i] = k; examRender();
  if (state.fb) { const f = document.getElementById('xfb'); if (f) f.scrollIntoView({block: 'nearest', behavior: 'smooth'}); }
}

function examRender(){
  const n = state.qs.length, q = state.qs[state.i], z = prefs.zoom || 1;
  const answered = state.sel.filter(v => v >= 0).length;
  const mine = state.sel[state.i], locked = state.fb && mine >= 0;
  const correctSoFar = state.sel.filter((v, k) => v >= 0 && v === state.qs[k].ans).length;
  const optCls = k => !locked ? (mine === k ? 'sel' : '') : k === q.ans ? 'correct' : k === mine ? 'wrong' : 'dim';
  const fbHtml = !locked ? '' : `<div class="fb ${mine === q.ans ? 'good' : 'bad'}" id="xfb" role="status">
      <span class="t">${mine === q.ans ? 'Correct.' : `Incorrect. The correct answer is ${'ABCD'[q.ans]}.`}</span>
      <div class="why"><b>Why:</b> ${esc(q.exp)}</div><div class="src">Source · ${esc(q.src)}</div></div>`;
  app.innerHTML = `<div class="xm" style="--z:${z}">
  <header class="xm-top">
    <div class="xm-title"><b>ITIL® Foundation (Version 5) – Practice Exam</b><small>${esc(state.title)} · Candidate: Practice candidate</small></div>
    <div class="xm-tools">
      <div class="xm-zoom" title="Text size"><button id="zm" aria-label="Smaller text">A−</button><button id="zp" aria-label="Larger text">A+</button></div>
      <div class="xm-time" id="xtb"><span>Time remaining</span><b id="xt">${fmt(state.left)}</b></div>
    </div>
  </header>
  <div class="xm-body">
    <aside class="xm-nav" id="xnav"><h4>Questions</h4>
      <div class="xm-legend"><span><i class="l-ans"></i>Answered</span><span><i></i>Unanswered</span><span class="lg-flag">${FLAG}Flagged</span></div>
      ${state.qs.map((qq, k) => `<div class="xm-q ${k === state.i ? 'cur' : ''} ${state.sel[k] >= 0 ? 'ans' : ''} ${state.flag[k] ? 'flag' : ''} ${state.fb && state.sel[k] >= 0 ? (state.sel[k] === qq.ans ? 'ok' : 'no') : ''}">
        <button class="flagbtn ${state.flag[k] ? 'on' : ''}" data-flag="${k}" aria-pressed="${state.flag[k]}" title="${state.flag[k] ? 'Unflag' : 'Flag'} question ${k + 1}" aria-label="Flag question ${k + 1}">${FLAG}</button>
        <button data-go="${k}" aria-label="Question ${k + 1}"><span><span class="qlbl">Question </span>${k + 1}</span><span class="st"></span></button></div>`).join('')}
    </aside>
    <main class="xm-main" id="xmain">
      <div class="xm-qhead"><b>Question ${state.i + 1} of ${n}</b>
        <button class="xm-flag ${state.flag[state.i] ? 'on' : ''}" id="xflag" aria-pressed="${state.flag[state.i]}">${FLAG}<span>${state.flag[state.i] ? 'Flagged for review' : 'Flag for review'}</span></button></div>
      <p class="xm-stem">${esc(q.q)}</p>
      <div class="xm-opts">${q.opts.map((o, k) => `<button class="xo ${optCls(k)}" data-k="${k}" aria-pressed="${mine === k}" ${locked ? 'aria-disabled="true"' : ''}><span class="xl">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      ${fbHtml}
    </main>
  </div>
  <footer class="xm-foot">
    <div class="grp"><button id="xprev" ${state.i === 0 ? 'disabled' : ''} aria-label="Previous question">←<span class="lbl"> Previous</span></button><button class="primary" id="xnext" ${state.i === n - 1 ? 'disabled' : ''}>Next →</button>
      <span class="prog">${answered} of ${n} answered${state.fb ? ` · ${correctSoFar} correct` : ''} · ${state.flag.filter(Boolean).length} flagged</span></div>
    <div class="grp"><button class="ghost" id="xexit">Exit</button><button class="end" id="xend">End Exam</button></div>
  </footer></div>`;
  app.querySelectorAll('.xo').forEach(b => b.onclick = () => examPick(+b.dataset.k));
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => examGo(+b.dataset.go));
  app.querySelectorAll('[data-flag]').forEach(c => c.onclick = () => { const k = +c.dataset.flag; state.flag[k] = !state.flag[k]; examRender(); });
  document.getElementById('xflag').onclick = () => { state.flag[state.i] = !state.flag[state.i]; examRender(); };
  document.getElementById('xprev').onclick = () => examGo(state.i - 1);
  document.getElementById('xnext').onclick = () => examGo(state.i + 1);
  document.getElementById('xend').onclick = examEndAsk;
  document.getElementById('xexit').onclick = () => modal('Exit the exam?', '<p>Your answers will not be saved and no result will be recorded.</p>',
    [{label: 'Return to exam'}, {label: 'Exit without result', danger: true, fn: home}]);
  document.getElementById('zm').onclick = () => setZoom(-0.1);
  document.getElementById('zp').onclick = () => setZoom(0.1);
  const cur = app.querySelector('.xm-q.cur'); if (cur) cur.scrollIntoView({block: 'nearest', inline: 'nearest'});
}

function examGo(k){
  if (k < 0 || k >= state.qs.length) return;
  state.i = k; examRender();
  const m = document.getElementById('xmain'); if (m) m.scrollTop = 0;
}

function setZoom(d){
  prefs.zoom = Math.min(1.5, Math.max(0.85, Math.round(((prefs.zoom || 1) + d) * 100) / 100));
  store.prefs = prefs; save(store); examRender();
}

function examEndAsk(){
  const un = state.sel.filter(v => v < 0).length, fl = state.flag.filter(Boolean).length;
  let body = '';
  if (un) body += `<p><b>You have ${un} unanswered question${un > 1 ? 's' : ''}.</b> Unanswered questions will be marked as incorrect.</p>`;
  if (fl) body += `<p>You have ${fl} flagged question${fl > 1 ? 's' : ''}.</p>`;
  body += '<p>Are you sure you want to end the exam? Your answers will be submitted and you will not be able to change them.</p>';
  modal('End exam', body, [{label: 'Return to exam'}, {label: 'End exam', danger: true, fn: examSubmit}]);
}

function examSubmit(){
  if (state.over) return;
  state.over = true; stopTimer();
  state.used = state.qs.length * EXAM_SECS_PER_Q - Math.max(state.left, 0);
  state.picks = state.sel.map((k, i) => ({k, ok: k === state.qs[i].ans}));
  document.body.classList.remove('exam');
  results();
}

function modal(title, body, buttons){
  closeModal();
  const bg = document.createElement('div');
  bg.className = 'modal-bg'; bg.id = 'modal';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(title)}</h3>${body}
    <div class="btns">${buttons.map((b, i) => `<button data-i="${i}" class="${b.danger ? 'end' : b.primary ? 'primary' : ''}">${esc(b.label)}</button>`).join('')}</div></div>`;
  document.body.appendChild(bg);
  bg.querySelectorAll('[data-i]').forEach(el => el.onclick = () => { closeModal(); const f = buttons[+el.dataset.i].fn; if (f) f(); });
  const last = bg.querySelector('.btns button:last-child'); if (last) last.focus();
}
function closeModal(){ const m = document.getElementById('modal'); if (m) m.remove(); }

function stopTimer(){ if (tick) { clearInterval(tick); tick = null; } }

function results(){
  stopTimer();
  const total = state.qs.length, score = state.picks.filter(p => p.ok).length;
  const pass = score >= Math.ceil(PASS * total);
  if (state.mode === 'sec' && !state.partial) {
    store.sec = store.sec || {};
    const st = store.sec[state.n] || {};
    st.attempts = (st.attempts || 0) + 1; st.last = score; st.best = Math.max(st.best || 0, score);
    store.sec[state.n] = st; save(store);
  }
  const missed = state.qs.map((q, i) => state.picks[i].ok ? null : q).filter(Boolean);
  const isExam = state.kind === 'exam';
  const pct = Math.round(score / total * 100);
  const head = isExam ? `<div class="card result-sheet">
    <div class="rs-head"><div><div class="eyebrow">Provisional result</div><b style="font-size:1.05rem">ITIL® Foundation (Version 5) – Practice Exam</b></div>
      <span class="verdict-tag ${pass ? 'pass' : 'fail'}">${pass ? 'PASS' : 'FAIL'}</span></div>
    <table>
      <tr><td>Candidate</td><td>Practice candidate</td></tr>
      <tr><td>Paper</td><td>${esc(state.title)}</td></tr>
      <tr><td>Date</td><td>${new Date().toLocaleString()}</td></tr>
      <tr><td>Score</td><td><b>${score} / ${total}</b> (${pct}%)</td></tr>
      <tr><td>Pass mark</td><td>${Math.ceil(PASS * total)} / ${total} (65%)</td></tr>
      <tr><td>Answered</td><td>${state.picks.filter(p => p.k >= 0).length} of ${total}</td></tr>
      <tr><td>Time used</td><td>${fmt(state.used || 0)} of ${fmt(total * EXAM_SECS_PER_Q)}</td></tr>
    </table></div>` : '';
  let html = `<div class="topbar"><button class="ghost" id="home">← All sections</button><span class="meta">${esc(state.title)}</span></div>
  ${head}
  <div class="card score noprint" ${isExam ? 'style="padding:24px"' : ''}>${isExam ? '' : `<div class="eyebrow">Your result</div>
  <div class="big">${score}<small> / ${total}</small></div>
  <div class="verdict">${pct}% &nbsp;·&nbsp; ${pass ? '<span class="pill pass">Pass — 65% or more</span>' : '<span class="pill fail">Below the 65% pass mark</span>'}</div>`}
  <div class="row" style="justify-content:center">
    <button class="primary" id="again">Retake ${state.mode === 'mock' ? 'a new mock exam' : isExam ? 'this exam' : 'this section'}</button>
    ${missed.length && state.mode === 'sec' ? `<button id="missed">Retake the ${missed.length} I missed</button>` : ''}
    ${isExam ? '<button id="print">Print result</button>' : ''}
  </div>
  <div class="row" style="justify-content:center;margin-top:18px"><label class="tog"><input type="checkbox" id="onlyWrong"> Show only the questions I got wrong</label></div>
  </div><div class="card revcard" id="rev">`;
  state.qs.forEach((q, i) => {
    const p = state.picks[i];
    const yours = p.k === -1 ? (isExam ? 'Not answered' : 'No answer (time ran out)') : `${'ABCD'[p.k]}. ${q.opts[p.k]}`;
    html += `<div class="rev ${p.ok ? 'r-ok' : 'r-no'}"><div class="q"><i>${i + 1}.</i>${esc(q.q)}</div>
      <div class="a ${p.ok ? 'ok' : 'no'}">${p.ok ? '✓' : '✗'} Your answer: ${esc(yours)}</div>
      ${p.ok ? '' : `<div class="a ok">✓ Correct answer: ${'ABCD'[q.ans]}. ${esc(q.opts[q.ans])}</div>`}
      <div class="e">${esc(q.exp)} <i>· ${esc(q.src)}${q.sec ? ', Section ' + q.sec : ''}</i></div></div>`;
  });
  html += '</div>';
  app.innerHTML = html;
  document.getElementById('home').onclick = home;
  document.getElementById('again').onclick = () => state.mode === 'mock' ? startMock() : startExam(state.n);
  const pr = document.getElementById('print'); if (pr) pr.onclick = () => window.print();
  const m = document.getElementById('missed');
  if (m) { const idx = missed.map(q => q.orig); const n = state.n; m.onclick = () => startExam(n, idx); }
  document.getElementById('onlyWrong').onchange = e => app.querySelectorAll('.r-ok').forEach(r => r.classList.toggle('hidden', e.target.checked));
  window.scrollTo(0, 0);
}

function study(n){
  stopTimer();
  const s = QB.sections[n-1];
  let html = `<div class="topbar"><button class="ghost" id="home">← All sections</button><button class="primary" id="go">Start exam &nbsp;→</button></div>
  <div class="eyebrow">Section ${String(n).padStart(2, '0')} · Study answers</div>
  <h2 style="margin-top:8px">${esc(s.title)}</h2><p class="sub">${esc(s.refs)} · all ${s.items.length} questions with their answers</p><div class="card revcard">`;
  s.items.forEach((it, i) => {
    const [q, right, , exp, src] = it;
    html += `<div class="rev"><div class="q"><i>${i + 1}.</i>${esc(q)}</div><div class="a ok">✓ ${esc(right)}</div>
      <div class="e">${esc(exp)} <i>· ${esc(src)}</i></div></div>`;
  });
  app.innerHTML = html + '</div>';
  document.getElementById('home').onclick = home;
  document.getElementById('go').onclick = () => startExam(n);
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (!state) return;
  if (document.getElementById('modal')) return;
  if (state.kind === 'exam' && document.querySelector('.xm') && !state.over) {
    if (e.target.tagName === 'INPUT' && e.key === ' ') return;
    const map = {'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
    const k = map[e.key.toLowerCase()];
    if (k != null) examPick(k);
    else if (e.key === 'Enter' && state.fb && state.sel[state.i] >= 0) { e.preventDefault(); examGo(state.i + 1); }
    else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'n') examGo(state.i + 1);
    else if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'p') examGo(state.i - 1);
    else if (e.key.toLowerCase() === 'f') { state.flag[state.i] = !state.flag[state.i]; examRender(); }
  }
});

home();
})();
</script>
</body>
</html>
